global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Giám sát Prometheus
  - job_name: "prometheus"
    static_configs:
      - targets:
          - "localhost:9090"

  # Giám sát tài nguyên container
  - job_name: "cadvisor"
    static_configs:
      - targets:
          - "cadvisor:8080"

  # Giám sát MySQL
  - job_name: "mysql"
    static_configs:
      - targets:
          - "mysql_exporter:9104"

  # Giám sát Nginx
  - job_name: "nginx"
    static_configs:
      - targets:
          - "nginx_exporter:9113"

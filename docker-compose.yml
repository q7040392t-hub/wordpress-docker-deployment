name: wordpress-lab

services:
  # =====================================
  # 1. MYSQL 8.0.40
  # =====================================
  mysql:
    image: mysql:8.0.40
    restart: unless-stopped
    user: "999:999"

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: wpdb
      MYSQL_USER: wpuser
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    volumes:
      - mysql_data:/var/lib/mysql
      - ./runtime/init.sql:/docker-entrypoint-initdb.d/01-monitor.sql:ro

    networks:
      - database

    healthcheck:
      test:
        - CMD-SHELL
        - 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u wpuser -D wpdb -e "SELECT 1" >/dev/null 2>&1'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

    security_opt:
      - no-new-privileges:true

  # =====================================
  # 2. WORDPRESS
  # =====================================

  wordpress:
    image: wordpress:php8.2-apache
    restart: unless-stopped

    environment:
      WORDPRESS_DB_HOST: mysql:3306
      WORDPRESS_DB_NAME: wpdb
      WORDPRESS_DB_USER: wpuser
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}

      WORDPRESS_CONFIG_EXTRA: |
        if (
            isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) &&
            $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https'
        ) {
            $$_SERVER['HTTPS'] = 'on';
        }

    volumes:
      - wordpress_data:/var/www/html

    networks:
      - frontend
      - database

    depends_on:
      mysql:
        condition: service_healthy

  # =====================================
  # 3. PHPMYADMIN
  # =====================================

  phpmyadmin:
    image: phpmyadmin:5.2.2
    restart: unless-stopped

    environment:
      PMA_HOST: mysql
      PMA_PORT: "3306"
      UPLOAD_LIMIT: 128M

    ports:
      - "127.0.0.1:8096:80"

    networks:
      - frontend
      - database

    depends_on:
      mysql:
        condition: service_healthy

  # =====================================
  # 4. NGINX REVERSE PROXY
  # =====================================

  # =========================================
  # NGINX REVERSE PROXY HTTP + HTTPS
  # =========================================
  nginx:
    build:
      context: ./nginx
    image: wordpress-lab-nginx:local
    restart: unless-stopped

    ports:
      - "127.0.0.1:8095:8080"
      - "127.0.0.1:8445:8443"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - nginx_logs:/var/log/nginx

    networks:
      - frontend
      - monitoring

    depends_on:
      wordpress:
        condition: service_started

    security_opt:
      - no-new-privileges:true

  # =====================================
  # 5. MYSQL EXPORTER
  # =====================================
  mysql_exporter:
    image: prom/mysqld-exporter:v0.16.0
    restart: unless-stopped

    command:
      - --mysqld.address=mysql:3306
      - --mysqld.username=wpuser

    environment:
      MYSQLD_EXPORTER_PASSWORD: ${MYSQL_PASSWORD}

    networks:
      - database
      - monitoring

    depends_on:
      mysql:
        condition: service_healthy

  # =====================================
  # 6. NGINX EXPORTER
  # =====================================
  nginx_exporter:
    image: nginx/nginx-prometheus-exporter:1.4.2
    restart: unless-stopped

    command:
      - --nginx.scrape-uri=http://nginx:8080/stub_status

    networks:
      - frontend
      - monitoring

    depends_on:
      nginx:
        condition: service_started

  # =====================================
  # 7. CADVISOR
  # =====================================
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped

    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro

    networks:
      - monitoring

    privileged: true

    healthcheck:
      test:
        - CMD-SHELL
        - "test -d /sys/fs/cgroup"
      interval: 30s
      timeout: 10s
      retries: 3

  # =====================================
  # 8. PROMETHEUS
  # =====================================
  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped

    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle

    ports:
      - "127.0.0.1:9090:9090"

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    networks:
      - monitoring

    depends_on:
      cadvisor:
        condition: service_started
      mysql_exporter:
        condition: service_started

  # =====================================
  # 9. LOKI
  # =====================================
  loki:
    image: grafana/loki:3.4.2
    restart: unless-stopped

    command:
      - -config.file=/etc/loki/local-config.yaml

    volumes:
      - loki_data:/loki

    networks:
      - monitoring

  # =====================================
  # 10. PROMTAIL
  # =====================================
  promtail:
    image: grafana/promtail:3.4.2
    restart: unless-stopped

    command:
      - -config.file=/etc/promtail/config.yml

    volumes:
      - ./promtail/config.yml:/etc/promtail/config.yml:ro
      - nginx_logs:/var/log/nginx:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro

    networks:
      - monitoring

    depends_on:
      loki:
        condition: service_started

  # =====================================
  # 11. GRAFANA
  # =====================================
  grafana:
    image: grafana/grafana:11.6.0
    restart: unless-stopped

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"

    ports:
      - "127.0.0.1:3001:3000"

    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro

    networks:
      - monitoring

    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started

# =====================================
# NETWORK CONFIGURATION
# =====================================
networks:
  frontend:
    driver: bridge

  database:
    driver: bridge
    internal: true

  monitoring:
    driver: bridge

# =====================================
# PERSISTENT VOLUMES
# =====================================
volumes:
  mysql_data:

  wordpress_data:

  nginx_logs:

  prometheus_data:

  grafana_data:

  loki_data:
